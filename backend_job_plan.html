<template id="tpl-overview">
  <p class="eyebrow">October 4 to December 15, 2026</p>
  <h1>Your plan at a glance</h1>
  <p class="lede">Six focused hours a day: five hours of algorithms, learning, practice, building and review, and one hour of job search. Every hour of every day is already decided. Open the Today tab each morning and do the blocks in order.</p>

  <section class="panel">
    <h2>The goal</h2>
    <p>A junior or intermediate <b>Java backend developer</b> role (Software Developer, Backend Developer, Java Developer or Software Engineer) in Montreal, Toronto or remote within Canada, at a company that builds its own software. You are not looking for QA, SDET or test automation roles, contact-centre or IVR work, or another consulting or staffing company.</p>
    <p>The standard is not “I covered the topic”. The standard is “I can do it alone, from a blank file, under the clock”. The Method page explains the five levels you move through.</p>
  </section>

  <section class="panel">
    <h2>How the six hours change over ten weeks</h2>
    <p>Early weeks need more learning. Later weeks move toward building, timed problems, system design, debugging and mock interviews.</p>
    <div class="tablewrap"><table>
      <tr><th>Hour</th><th>Weeks 1–3 · Foundations</th><th>Weeks 4–7 · Build depth</th><th>Weeks 8–10 · Pressure</th></tr>
      <tr><td class="t">1</td><td>DSA: new problems</td><td>DSA: new problems</td><td>DSA: new problems under the timer, talking out loud</td></tr>
      <tr><td class="t">2</td><td>Learn a concept (resource given)</td><td>Learn (35–40 min), then apply it at once</td><td>DSA repetition and your weakest pattern</td></tr>
      <tr><td class="t">3</td><td>Practice: closed-book drills on that concept</td><td>Build: the project feature</td><td>Learn: security, AWS, system design, concurrency, or a mock</td></tr>
      <tr><td class="t">4</td><td>Build: the project</td><td>Build: tests, debugging, breaking and fixing</td><td>Build, debug or design practice</td></tr>
      <tr><td class="t">5</td><td>Review: LeetCode redos, active recall, Anki</td><td>Review: LeetCode redos, active recall, Anki</td><td>Review, AWS questions, then interview rapid-fire</td></tr>
      <tr><td class="t">6</td><td>Job search</td><td>Job search</td><td>Job search, after work on bench days</td></tr>
    </table></div>
    <p style="margin-top:12px"><b>Sundays are assessment days.</b> A timed DSA test, three-week repetitions, a closed-book concept checkpoint, a build-from-scratch test, a remediation hour, and the weekly job review. <b>Saturdays are rest.</b></p>
  </section>

  <section class="panel">
    <h2>Your daily times</h2>
    <div class="tablewrap"><table>
      <tr><th>Block</th><th>Leave days and every Sunday</th><th>Bench days (from November 23)</th></tr>
      <tr><td>Work check-in</td><td class="t">—</td><td class="t">9:00 – 9:30 a.m.</td></tr>
      <tr><td>Hour 1</td><td class="t">9:00 – 10:00 a.m.</td><td class="t">9:30 – 10:30 a.m.</td></tr>
      <tr><td>Hour 2</td><td class="t">10:10 – 11:10 a.m.</td><td class="t">10:40 – 11:40 a.m.</td></tr>
      <tr><td>Hour 3</td><td class="t">11:20 a.m. – 12:20 p.m.</td><td class="t">11:50 a.m. – 12:50 p.m.</td></tr>

      <tr><td>Hour 4</td><td class="t">1:00 – 2:00 p.m.</td><td class="t">1:30 – 2:30 p.m.</td></tr>

    <p style="margin-top:12px">The 10-minute gaps are real breaks: stand up, drink water, look away from the screen. If another time of day suits you better, keep the order and shift everything.</p>
  </section>

  <section class="panel">
    <h2>The ten weeks</h2>
    <div id="weeklist"></div>

  <section class="panel">
    <h2>What you will have on December 15</h2>
    <p>About 120 new LeetCode problems in Python and about 247 scheduled redos. One serious project, Order Manager: a Spring Boot API on PostgreSQL with transactions, validation, Spring Security and JWT, a Redis cache, an outbox that publishes to Kafka, a second service that consumes safely, unit, controller and Testcontainers tests in GitHub Actions, and deployments on Docker Compose, Kubernetes and AWS. The AWS Certified Cloud Practitioner exam on December 6. Six behavioural stories in English and French, two system designs you can run out loud, and a full mock interview day.</p>
  </section>

  <section class="panel">
    <h2>About December 15</h2>
    <p>This plan gives you the best chance of an offer by December 15. Nobody can promise the date, because the employer makes the final decision. If December 15 arrives without an offer, the search continues to March 31, 2027, with a checkpoint on January 31, and you will be a much stronger candidate than you are today. If you receive an offer at any point, bring it to Claude before you accept, so you can review it together.</p>

<template id="tpl-method">
  <p class="eyebrow">How the plan works</p>
  <h1>Method</h1>
  <p class="lede">Learning exists to make practice possible. Every concept goes through the same cycle, and nothing moves on until you can do it alone.</p>

  <section class="panel">
    <h2>The cycle</h2>
    <div class="seq"><span>Learn</span><i>→</i><span>Practise</span><i>→</i><span>Make mistakes</span><i>→</i><span>Review</span><i>→</i><span>Practise again</span><i>→</i><span>Build</span><i>→</i><span>Revisit later</span><i>→</i><span>Apply under pressure</span></div>
    <p>Here is where each step lives in your week. You learn in the Learn hour. You practise in the drill hour, with the resource closed. Your mistakes go into the DSA log and Anki. The Review hour brings problems back after 2 and 6 DSA days and questions back after 1 and 5 learning days. The Build hours put the concept into your project. Sunday brings problems back after three weeks and tests concepts closed-book. Weeks 8 to 10 put everything under the timer and in mock interviews.</p>
  </section>

  <section class="panel">
    <h2>The five levels</h2>
    <p>Every mastery item on a Week page names its target level. A topic counts as learned only at Level 3 or above, shown on Sunday.</p>
    <div class="levels">
      <div class="lvl"><span class="n">1</span><div><b>I understand it.</b> You can explain it in your own words without notes.</div></div>
      <div class="lvl"><span class="n">2</span><div><b>I can do it with guidance.</b> You can do it with the documentation, your notes or a video open.</div></div>
      <div class="lvl"><span class="n">3</span><div><b>I can do it alone.</b> Blank file, nothing open except the editor, no AI, within the time limit. This is the minimum to move on.</div></div>
      <div class="lvl"><span class="n">4</span><div><b>I can do it under pressure.</b> On a timer, talking out loud, recorded or watched by someone.</div></div>
      <div class="lvl"><span class="n">5</span><div><b>I can apply it in a real environment.</b> It is in your project, tested, running in Docker, Kubernetes or AWS, and you have debugged it when it broke.</div></div>
    </div>
  </section>

  <section class="panel">
    <h2>Grading every LeetCode problem</h2>
    <div class="tablewrap"><table>
      <tr><th>Grade</th><th>Meaning</th><th>At its next redo</th></tr>
      <tr><td><b>G</b></td><td>Solved alone, optimal, in under 15 minutes for an easy or 25 for a medium.</td><td>Say the idea out loud, then type it in under 10 minutes.</td></tr>
      <tr><td><b>Y</b></td><td>Solved alone but slowly, not optimal, or after a hint.</td><td>Recode it fully from a blank editor.</td></tr>
      <tr><td><b>R</b></td><td>You needed the video or the solution.</td><td>Recode it fully from a blank editor. If it is still R, it goes to Sunday's remediation with two extra problems of the same pattern.</td></tr>
    </table></div>
    <h3 style="margin-top:16px">The 25-minute rule</h3>
    <ol>
      <li>Work alone for 25 minutes. Write the approach in plain words before you code.</li>
      <li>If you are stuck, watch only the first part of the NeetCode video, where the idea is explained, and close it. Try again for 10 minutes.</li>
      <li>If you are still stuck, watch the whole video, close it, and write the solution from memory. Never copy it. Grade the problem R.</li>
    </ol>
    <p>Do not use an AI assistant to solve or hint during practice. The only exception is the bug hunt on November 26, where you ask Claude to hide bugs for you to find.</p>
  </section>

  <section class="panel">
    <h2>Your two logs</h2>
    <p><b>The DSA log</b> is a spreadsheet with one row per attempt: date, problem, pattern, grade, minutes, the mistake in one sentence, and the next redo date. It tells you your weakest pattern at any moment: the one with the most Y and R grades.</p>
    <p><b>Anki</b> (free at apps.ankiweb.net) holds your concept cards. Every Learn hour ends with 5 cards written as questions. Every Review hour starts with your due cards. Anki schedules them for you, so cards you know well come back rarely and cards you miss come back soon.</p>
  </section>

  <section class="panel">
    <h2>When you struggle</h2>
    <p>The plan never tells you to move on from something you cannot do. Here is what happens instead.</p>
    <ol>
      <li><b>A problem stays R:</b> on Sunday, solve two problems from that pattern's practice list below. The original problem comes back in your redo schedule.</li>
      <li><b>A concept question is wrong on Sunday:</b> redo that day's practice task from a blank file in the remediation hour, and add the question to Anki.</li>
      <li><b>A Sunday build-from-scratch test fails:</b> redo it the next Sunday before the new one. Use the extra practice sources below during remediation until it passes.</li>
      <li><b>A whole week is not at Level 3:</b> use the next week's remediation hour for it first. If that is still not enough, tell Claude which items are behind, and the following week will be adjusted.</li>
    </ol>
    <h3 style="margin-top:16px">Extra practice sources by topic</h3>
    <div class="tablewrap"><table>
      <tr><th>Topic</th><th>Where to get more practice</th></tr>
      <tr><td>Core Java</td><td>The Java track on exercism.org: free exercises with automatic tests, ordered by concept.</td></tr>
      <tr><td>SQL</td><td>The remaining categories on pgexercises.com (Date, String, Recursive), then the LeetCode “SQL 50” study plan.</td></tr>
      <tr><td>Git</td><td>All remaining levels on learngitbranching.js.org.</td></tr>
      <tr><td>Spring Boot</td><td>Redo the Spring Academy labs from a blank project; then build a second tiny API on a new subject.</td></tr>
      <tr><td>Docker and Kubernetes</td><td>Free scenarios on killercoda.com, and the break-and-fix drills from your own weeks.</td></tr>
      <tr><td>AWS</td><td>Tutorials Dojo section sets for your weakest domain, in review mode.</td></tr>
      <tr><td>DSA</td><td>The pattern practice lists below.</td></tr>
    </table></div>
  </section>

  <section class="panel">
    <h2>Pattern practice lists</h2>
    <p>Use these for remediation and for your weakest pattern. They are not used anywhere else in the plan, so they stay new to you.</p>
    <div id="bank"></div>
  </section>

  <section class="panel">
    <h2>The rules</h2>
    <ol>
      <li><b>Saturday is always a rest day.</b> Ten weeks at this intensity only work with real rest.</li>
      <li><b>The minimum day.</b> If you are sick or have a very hard day, do one LeetCode redo and send one application. That still counts, and you continue normally the next day.</li>
      <li><b>Never double a day to catch up.</b> If you miss something, continue with today. Unfinished work goes into Sunday's remediation hour.</li>
      <li><b>If you finish a block early, go deeper.</b> Redo the task from a blank file, or improve your code. Do not start the next block early.</li>
      <li><b>Push to GitHub every day</b>, and from Week 4, deliver every feature through a branch and a pull request.</li>
      <li><b>Apply before you feel ready.</b> Hiring takes four to eight weeks, so applications start in Week 2.</li>
      <li><b>A skill goes on your resume only after you have used it in your project.</b> The plan tells you when.</li>
    </ol>
  </section>

  <section class="panel">
    <h2>If Cognizant staffs you on a project</h2>
    <p>On the bench, keep the full schedule. If you are assigned to a project and your days fill up, switch to the evening version for as long as that lasts: from 7:00 to 10:10 p.m., do Hour 1 (DSA), Hour 5 (review) and Hour 6 (job search), with 10-minute breaks. Skip the Learn and Build hours on those days, and keep Sundays and Saturdays as planned.</p>
  </section>

  <section class="panel">
    <h2>When you get an interview</h2>
    <p>Use the Learn and Build hours of the days before it to prepare instead:</p>
    <ol>
      <li>Read the posting and write down the five main skills it asks for.</li>
      <li>Research the company: what it builds, its customers, and recent news.</li>
      <li>Practise “Tell me about yourself” and three stories out loud.</li>
      <li>Solve three LeetCode problems from your weakest patterns, timed.</li>
      <li>Prepare three questions to ask the interviewer.</li>
      <li>Within an hour after the interview, write down every question you were asked, and send a short thank-you email the same day.</li>
    </ol>
  </section>
</template>

  <section class="panel">
    <h2>STAR story template</h2>
    <ol>
      <li><b>Situation:</b> where you were and what the context was, in one or two sentences.</li>
      <li><b>Task:</b> what you were responsible for.</li>
      <li><b>Action:</b> what you did, step by step. This is the longest part. Say “I”, not “we”.</li>
      <li><b>Result:</b> what happened in the end, and what you learned.</li>
    </ol>
    <p><b>Your six stories:</b> (1) a hard technical problem you solved, (2) a disagreement with a teammate or manager, (3) a mistake and what you learned, (4) learning something new very quickly, (5) “Tell me about yourself”, and (6) why you are moving from QA into development. Each one should take under two minutes. You do not need to talk about your leave in interviews; you are still employed at Cognizant, so there is no gap on your resume.</p>

const app = document.getElementById('app');
const KIND = {dsa:'DSA',learn:'Learn',practice:'Practice',build:'Build',review:'Review',job:'Job search',assess:'Assessment',work:'Work',design:'Design',mock:'Mock interview',aws:'AWS',rest:'Rest'};
const TYPE = {leave:'Leave day',sunday:'Assessment Sunday',bench:'Bench day',special:'Special day',rest:'Rest day'};
const PHASE = {1:'Foundations',2:'Build depth',3:'Pressure'};
const byDate = Object.fromEntries(DATA.days.map(d=>[d.date,d]));
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

function todayISO(){
  let t;
  try{ t = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
  catch(e){ t = new Date().toISOString().slice(0,10); }
  const first = DATA.days[0].date, last = DATA.days[DATA.days.length-1].date;
  if (t < first) return first;
  if (t > last) return last;
  return t;
}

function probLi(p){
  return `<li><a href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener"><span class="pnum">#${p.n}</span> ${esc(p.name)}</a>${p.note?` <span class="pnote">(${esc(p.note)})</span>`:''}</li>`;
}
function stepHTML(s){
  if (typeof s === 'string') return `<li>${esc(s)}</li>`;
  let inner = '';
  if (s.probs) inner = `<ul>${s.probs.map(probLi).join('')}</ul>`;
  if (s.items) inner = `<ul>${s.items.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`;
  return `<li>${esc(s.label||'')}${inner}</li>`;
}

function blockHTML(day, b, i){
  const key = `jjp-${day.date}-${i}`;
  const done = store(key) === '1';
  let extra = '';
  if (b.resource) extra += `<p class="res"><b>Resource:</b> ${esc(b.resource)}</p>`;
  extra += `<ul>${b.steps.map(stepHTML).join('')}</ul>`;
  if (b.check) extra += `<div class="checkq"><b>Check yourself before you leave this hour</b><ul>${b.check.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`;
  if (b.done) extra += `<p class="done-def"><b>Done when</b>${esc(b.done)}</p>`;
  return `<article class="blk k-${b.kind}${done?' done':''}" data-key="${key}">
    <div><div class="time">${esc(b.time)}</div><div class="kind">${esc(KIND[b.kind]||b.kind)}</div></div>
    <div style="min-width:0"><div class="bhead"><h3>${esc(b.title)}</h3>
      <label class="chk"><input type="checkbox" id="${key}" ${done?'checked':''}> Done</label></div>${extra}</div>
  </article>`;
}

function lunchAfter(day, i){
  const b = day.blocks[i];
  if (!b) return false;
  return /12:20 p\.m\.|12:50 p\.m\./.test(b.time) && /^11/.test(b.time);
}

function dayBody(day){
  if (day.type === 'rest') return `<div class="rest-card"><h2>Rest</h2><p>${esc(day.note)}</p></div>`;
  let h = '';
  if (day.goal) h += `<div class="goal"><b>By the end of today</b>${esc(day.goal)} Every problem you touched is logged with a grade.</div>`;
  if (day.note) h += `<div class="note">${esc(day.note)}</div>`;
  h += `<div class="meter"><span class="cnt"></span><div class="track"><div class="fill"></div></div></div>`;
  h += '<div class="blocks">';
  day.blocks.forEach((b,i)=>{
    h += blockHTML(day,b,i);
    if (lunchAfter(day,i)) h += `<div class="lunch">LUNCH</div>`;
  });
  h += '</div>';
  return h;
}

function dayMeta(day){
  return `Week ${day.week} · Day ${day.n} · Phase ${day.phase}: ${PHASE[day.phase]} · ${TYPE[day.type]}`;
}

function updateMeters(root){
  root.querySelectorAll('[data-daywrap]').forEach(w=>{
    const boxes = [...w.querySelectorAll('.blk input[type=checkbox]')];
    const n = boxes.filter(b=>b.checked).length;
    const fill = w.querySelector('.fill'), cnt = w.querySelector('.cnt');
    if (fill) fill.style.width = (boxes.length? Math.round(100*n/boxes.length):0)+'%';
    if (cnt) cnt.textContent = `${n} of ${boxes.length} hours done`;
    const tag = w.querySelector('.donecount'); if (tag) tag.textContent = `${n}/${boxes.length} done`;
  });
}

function wire(root){
  root.querySelectorAll('.blk input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const art = cb.closest('.blk');
      store(art.dataset.key, cb.checked?'1':'0');
      art.classList.toggle('done', cb.checked);
      updateMeters(root);
    });
  });
  root.querySelectorAll('.mastery input').forEach(cb=>{
    cb.checked = store(cb.id)==='1';
    cb.addEventListener('change',()=>store(cb.id, cb.checked?'1':'0'));
  });
  updateMeters(root);
}

function neighbors(date){
  const i = DATA.days.findIndex(d=>d.date===date);
  return [DATA.days[i-1], DATA.days[i+1]];
}

function renderDay(date){
  const day = byDate[date] || byDate[todayISO()];
  const [prev,next] = neighbors(day.date);
  const isToday = day.date === todayISO();
  app.innerHTML = `<div data-daywrap>
    <p class="eyebrow">${isToday?'Today · ':''}${esc(dayMeta(day))}</p>
    <h1>${esc(day.label)}</h1>
    <div class="daynav">
      ${prev?`<a class="btn" href="#d-${prev.date}">← ${esc(prev.short)}</a>`:'<span></span>'}
      ${isToday?'':`<a class="btn primary" href="#today">Go to today</a>`}
      ${next?`<a class="btn" href="#d-${next.date}">${esc(next.short)} →</a>`:'<span></span>'}
    </div>
    ${dayBody(day)}
  </div>
  <p style="margin-top:22px"><a href="#week${day.week}">See all of Week ${day.week}, with its mastery checklist →</a></p>`;
  wire(app);
  setNav('today', day.week);
}

function renderWeek(n){
  const W = DATA.weeks.find(w=>w.n===n) || DATA.weeks[0];
  const t = todayISO();
  let h = `<p class="eyebrow">Week ${W.n} of 10 · ${esc(W.start)} to ${esc(W.end)} · Phase ${W.phase}: ${PHASE[W.phase]}</p>
    <h1>${esc(W.title)}</h1><p class="lede">${esc(W.summary)}</p>
    <div class="stats">
      <div class="stat"><b>${W.new}</b><span>new LeetCode problems</span></div>
      <div class="stat"><b>${W.redo}</b><span>scheduled redos</span></div>
      <div class="stat"><b>15 + 10</b><span>applications and messages</span></div>
    </div>
    <section class="panel"><h2>Mastery checklist</h2>
      <p>These are tested on the Sunday after this week. Tick an item only when you have shown it at the level named.</p>
      <ul class="mastery">${W.mastery.map((m,i)=>`<li><label><input type="checkbox" id="jjp-m-${W.n}-${i}"><span>${esc(m)}</span></label></li>`).join('')}</ul>
      <p style="margin-top:10px"><b>Project milestone:</b> ${esc(W.milestone)}</p>
    </section>
    <h2 style="margin-top:26px">Day by day</h2>`;
  W.days.forEach(ds=>{
    const d = byDate[ds];
    const open = ds===t || (!W.days.includes(t) && ds===W.days[0]);
    const tagline = d.type==='rest' ? 'Rest' : `${TYPE[d.type]} · <span class="donecount"></span>`;
    h += `<details class="day" data-daywrap ${open?'open':''}><summary><h3>${esc(d.label)}${ds===t?'<span class="today-pill">TODAY</span>':''}</h3><span class="tagline">${tagline}</span></summary>
      <div class="inner">${dayBody(d)}<p style="margin-top:12px"><a href="#d-${d.date}">Open this day on its own →</a></p></div></details>`;
  });
  const prev = W.n>1?`<a class="btn" href="#week${W.n-1}">← Week ${W.n-1}</a>`:'<span></span>';
  const next = W.n<10?`<a class="btn" href="#week${W.n+1}">Week ${W.n+1} →</a>`:'<span></span>';
  h += `<div class="daynav" style="margin-top:24px">${prev}${next}</div>`;
  app.innerHTML = h;
  wire(app);
  setNav('week', W.n);
}

function renderStatic(id){
  app.innerHTML = '';
  app.appendChild(document.getElementById('tpl-'+id).content.cloneNode(true));
  if (id==='overview'){
    document.getElementById('weeklist').innerHTML = DATA.weeks.map(w=>`<p><a href="#week${w.n}"><b>Week ${w.n}</b> · ${esc(w.start)} – ${esc(w.end)} · ${esc(w.title)}</a><br><span style="color:var(--muted)">${esc(w.summary)}</span></p>`).join('');
  }
  if (id==='method'){
    document.getElementById('bank').innerHTML = DATA.bank.map(b=>`<h3 style="margin-top:14px">${esc(b.pattern)}</h3><ul>${b.probs.map(probLi).join('')}</ul>`).join('');
  }
  setNav(id, null);
}

function setNav(view, week){
  document.querySelectorAll('.tab').forEach(a=>{
    if (a.dataset.v===view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  document.querySelector('.tab[data-v="week"]').href = '#week'+(week||byDate[todayISO()].week);
  document.querySelectorAll('.wk').forEach(a=>{
    if (view==='week' && +a.dataset.n===week) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}

function route(){
  const h = (location.hash||'').slice(1);
  if (!h || h==='today') return renderDay(todayISO());
  if (h.startsWith('d-')) return renderDay(h.slice(2));
  const m = h.match(/^week(\d+)$/);
  if (m) return renderWeek(+m[1]);
  if (['method','resources','overview'].includes(h)) return renderStatic(h);
  renderDay(todayISO());
}

document.getElementById('weekchips').innerHTML = DATA.weeks.map(w=>`<a class="wk" data-n="${w.n}" href="#week${w.n}">W${w.n} · ${esc(w.start.slice(4))}</a>`).join('');
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });
route();
</script>

</body></html>
